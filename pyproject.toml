[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dupe"
version = "0.1.0"
description = "A CLI tool to find duplicate files in a directory"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
]

[project.scripts]
dupe = "dupe.cli:main"

[project.optional-dependencies]
dev = [
    "flake8",
    "pytest",
]
